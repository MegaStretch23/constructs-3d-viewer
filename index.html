<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Constructs 3D viewer</title>
<link rel="stylesheet" href="style.css">
<script type="importmap">{"imports":{"three":"./vendor/three.module.min.js"}}</script>
</head><body>
<aside id="side">
  <h1>Constructs 3D viewer</h1>
  <p class="hint">Click a product to put it in the void. Drag it to move, wheel over it to resize, drag empty space to orbit.</p>
  <input id="filter" placeholder="Filter products" autocomplete="off">
  <ul id="list"></ul>
  <div class="row">
    <button id="shot">Save PNG</button>
    <button id="clear">Clear</button>
    <label class="btn">Load catalogue<input id="file" type="file" accept="application/json" hidden></label>
  </div>
  <p id="status" role="status"></p>
</aside>
<canvas id="c"></canvas>
<script type="module" src="js/main.js"></script>
</body></html>
